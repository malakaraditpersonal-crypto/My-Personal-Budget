<style>

.tour-progress{height:5px;background:var(--ac);border-radius:9px;overflow:hidden;margin:18px 0}.tour-progress i{display:block;height:100%;background:var(--tx);width:var(--w);transition:width .2s}.setting-note{margin:8px 0 12px}.home-top{min-height:30px}.sync-icon{width:38px;height:38px;flex:none;border:1px solid var(--ln);border-radius:50%;background:var(--sf);display:grid;place-items:center}.sync-icon svg{width:19px;height:19px}.pro h3{margin:23px 0 9px;padding-top:12px;border-top:1px solid var(--ln)}.pro .btn.g{margin-top:7px}.pro .chip{margin-bottom:4px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.glass body{background:linear-gradient(155deg,var(--g1),var(--g2) 55%,var(--g3)) fixed}

<script>
const EC=['Food','Groceries','Transport','Shopping','Entertainment','Bills','Health','Education','Subscriptions','Rent','Travel','Other'];
const IC=['Salary','Freelance','Business','Gift','Allowance','Investment','Other'];
const CUR={NPR:['रू','en-IN',2,'Nepalese Rupee'],INR:['₹','en-IN',2,'Indian Rupee'],USD:['$','en-US',2,'US Dollar'],EUR:['€','en-US',2,'Euro'],GBP:['£','en-US',2,'British Pound'],AED:['AED','en-US',2,'UAE Dirham'],QAR:['QAR','en-US',2,'Qatari Riyal'],MYR:['RM','en-US',2,'Malaysian Ringgit'],AUD:['A$','en-US',2,'Australian Dollar'],CAD:['C$','en-US',2,'Canadian Dollar'],SGD:['S$','en-US',2,'Singapore Dollar'],JPY:['¥','en-US',0,'Japanese Yen'],CNY:['CN¥','en-US',2,'Chinese Yuan'],BDT:['৳','en-IN',2,'Bangladeshi Taka'],PKR:['Rs','en-IN',2,'Pakistani Rupee']};

let S,tab='home',M=today().slice(0,7),q='',ft='all',F=null,pad='';

S=Object.assign(init(),S||{});
if(!Array.isArray(S.acc)||!S.acc.length)S.acc=init().acc;if(!Array.isArray(S.tx))S.tx=[];if(!S.bud||typeof S.bud!=='object'||Array.isArray(S.bud))S.bud=init().bud;if(!S.bud.cats||typeof S.bud.cats!=='object')S.bud.cats={};if(!Array.isArray(S.goals))S.goals=[];if(!S.last||typeof S.last!=='object')S.last={};if(!Number.isSafeInteger(+S.next)||+S.next<1)S.next=10;if(!CUR[S.cur])S.cur='NPR';if(!['','light','dark'].includes(S.theme))S.theme='';if(!['ad','bs'].includes(S.cal))S.cal='ad';if(!S.notify||typeof S.notify!=='object')S.notify={frequency:'weekly',last:{},enabled:false};if(!['off','daily','weekly','monthly'].includes(S.notify.frequency))S.notify.frequency='weekly';if(!S.notify.last||typeof S.notify.last!=='object')S.notify.last={};

function sg(o){const r={...o};delete r.u;const s=JSON.stringify(r);let h=5381;for(let i=0;i<s.length;i++)h=(h*33)^s.charCodeAt(i);return h>>>0}

let driveToken='',driveExp=0,driveEmail='',vTok='',tokClient=null,tokWait=null,syncing=false,again=false,syncTimer=0,dstat={s:'',m:''};
const DAPP='https://www.googleapis.com/auth/drive.appdata';
function setSt(s,m){dstat={s,m:m||''};const e=$('#drive-status');if(e)e.textContent=driveStatusText();const b=document.querySelector('.sync-icon');if(b)b.style.opacity=s==='busy'?.5:1}
function ago(t){const s=(Date.now()-t)/1000;return s<45?'just now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':new Date(t).toLocaleDateString()}
function driveStatusText(){const u=S.user||{};if(!u.driveSync)return'Not connected. Google sign-in alone does not sync your budget.';if(dstat.s==='busy')return'Syncing…';if(dstat.s==='err'||dstat.s==='warn')return'Needs attention: '+dstat.m;return'Connected as '+(driveEmail||u.email||'your Google account')+(u.lastSync?' · Synced '+ago(u.lastSync):' · Not synced yet')}
function tokInit(){if(tokClient)return true;if(!window.google||!google.accounts||!google.accounts.oauth2)return false;
 tokClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:DAPP+' openid email',hint:S.user&&S.user.email||undefined,
  callback:r=>{const w=tokWait;tokWait=null;if(!w)return;if(r&&r.access_token&&google.accounts.oauth2.hasGrantedAllScopes(r,DAPP)){driveToken=r.access_token;driveExp=Date.now()+(+r.expires_in||3600)*1000;w.ok()}else w.no(Error(r&&r.error==='access_denied'?'Google Drive access was not granted.':'Google did not return access.'))},
  error_callback:e=>{const w=tokWait;tokWait=null;if(w)w.no(Object.assign(Error(e&&e.type==='popup_closed'?'The Google window was closed before access was granted.':'The Google window could not open.'),{popup:1}))}});return true}
function getToken(consent){if(driveToken&&Date.now()<driveExp-60000)return Promise.resolve();
 if(!tokInit())return Promise.reject(Error('Google is still loading. Try again in a moment.'));
 return new Promise((ok,no)=>{const t=setTimeout(()=>{if(tokWait){tokWait=null;no(Object.assign(Error('Google did not respond.'),{popup:1}))}},90000);tokWait={ok:()=>{clearTimeout(t);ok()},no:e=>{clearTimeout(t);no(e)}};tokClient.requestAccessToken({prompt:consent?'consent':''})})}
async function driveApi(url,opts={}){const r=await fetch(url,{...opts,headers:{Authorization:'Bearer '+driveToken,...(opts.headers||{})}});if(!r.ok){if(r.status===401||r.status===403)driveToken='';throw Object.assign(Error('Google Drive returned '+r.status),{status:r.status})}return r.status===204?null:r.json()}
async function verify(){if(vTok&&vTok===driveToken)return;const u=await driveApi('https://www.googleapis.com/oauth2/v3/userinfo');driveEmail=u.email||'';if(S.user.email&&driveEmail&&driveEmail.toLowerCase()!==S.user.email.toLowerCase()){driveToken='';throw Object.assign(Error('That Drive account ('+driveEmail+') is not the signed-in account ('+S.user.email+'). Choose the same account.'),{fatal:1})}vTok=driveToken}
async function driveFile(){const q=encodeURIComponent("'appDataFolder' in parents and name='mpb-backup.json' and trashed=false");const d=await driveApi('https://www.googleapis.com/drive/v3/files?q='+q+'&spaces=appDataFolder&fields=files(id,name,modifiedTime)');return d.files&&d.files[0]||null}
const driveRead=f=>driveApi('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media');
async function driveWrite(data,f){const b='mpb_'+Math.random().toString(16).slice(2),meta={name:'mpb-backup.json',mimeType:'application/json'};if(!f)meta.parents=['appDataFolder'];const body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(data)+'\r\n--'+b+'--';return driveApi(f?'https://www.googleapis.com/upload/drive/v3/files/'+f.id+'?uploadType=multipart':'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:f?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})}
function merge(a,b){const o={...a},del={...(b.del||{})};for(const k in a.del||{})del[k]=Math.max(del[k]||0,a.del[k]);o.del=del;
 for(const c of COLL){const m=new Map();for(const r of b[c]||[])m.set(String(r.id),r);for(const r of a[c]){const x=m.get(String(r.id));if(!x||(r.u||0)>=(x.u||0))m.set(String(r.id),r)}
  o[c]=[...m.values()].filter(r=>{const t=del[c+':'+r.id];return !t||(r.u||0)>t})}
 if((b.mu||0)>(a.mu||0)&&b.bud&&b.bud.cats&&CUR[b.cur]){o.bud=b.bud;o.cur=b.cur;o.mu=b.mu}
 if(!o.acc.length)o.acc=init().acc;o.sig=null;track(o);return o}
async function syncNow(manual){if(syncing||!S.user||!S.user.driveSync)return;
 if(!navigator.onLine)return setSt('warn','You are offline. Changes will sync when the connection returns.');
 syncing=true;setSt('busy');
 try{await getToken(false);await verify();track();const f=await driveFile();
  if(f){const r=await driveRead(f);if(!r||!Array.isArray(r.tx)||!Array.isArray(r.acc))throw Error('The backup in Drive is not valid. Your local data was not changed.');S=merge(S,r)}
  await driveWrite({...S,user:undefined},f);S.user.lastSync=Date.now();persist();setSt('ok');
  if(document.body.classList.contains('in')&&!$('#ov'))draw();if(manual)toast('Synced')}
 catch(e){const m=e.status===401||e.status===403?'Google access expired or was revoked. Tap Sync now to reconnect.':e.popup&&!manual?'Tap Sync now to refresh from Google Drive.':(e instanceof TypeError||!navigator.onLine)?'No connection. Will retry when you are back online.':e.popup?e.message+' Tap Sync now to try again.':(e.message||'Sync failed.');setSt('err',m);if(manual)toast(m)}
 finally{syncing=false;if(again){again=false;scheduleSync()}}}
function scheduleSync(){if(!S.user||!S.user.driveSync)return;if(syncing){again=true;return}clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,2500)}
async function driveConnect(){if(!S.user||!S.user.google)return toast('Sign in with Google first');
 try{await getToken(true);await verify()}catch(e){return toast(e.message)}
 S.user.driveSync=true;persist();draw();await syncNow(true)}
function driveSyncNow(){if(!S.user||!S.user.driveSync)return driveConnect();if(driveToken&&Date.now()<driveExp-60000)return syncNow(true);syncing||setSt('busy');syncNow(true)}
function driveOff(){try{if(driveToken&&window.google)google.accounts.oauth2.revoke(driveToken)}catch(e){}driveToken='';vTok='';delete S.user.driveSync;persist();draw();toast('Drive sync disconnected. Your Drive copy was kept.')}
addEventListener('online',scheduleSync);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)scheduleSync()});
function jwt(t){let p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(p),c=>c.charCodeAt(0))))}
function gcb(r){try{const u=jwt(r.credential);S.user=Object.assign(S.user||{},{name:u.given_name||u.name||'Friend',email:u.email,pic:u.picture,google:1});save();enter()}catch(e){toast('Google sign-in failed')}}
function ginit(n=0){const b=$('#gbtn');if(!b||!GOOGLE_CLIENT_ID)return;if(window.google&&google.accounts){google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:gcb});google.accounts.id.renderButton(b,{theme:'outline',size:'large',shape:'pill',text:'continue_with',width:280})}else if(n<25)setTimeout(()=>ginit(n+1),400)}
function welcome(){const g=$('#gate');g.className='';g.innerHTML=`<div class="gw"><svg class="lg sm" viewBox="0 0 100 100">${LOGO}</svg><h2 style="margin:0">Welcome</h2><div class="mu">My Personal Budget keeps your money simple. Your data stays on this device.</div>${GOOGLE_CLIENT_ID?'<div class="gb" id="gbtn"></div>':'<button class="gsetup" data-a="gsetup">Set up Google sign-in</button>'}<div class="mu">or</div><input id="wn" placeholder="Your name" autocomplete="off"><input id="wp" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN (optional)"><div class="mu" id="we" style="color:var(--rd)"></div><button class="btn" data-a="create" style="margin:0">Create profile</button><button class="lk" data-a="guest">Continue as guest</button></div>`;ginit()}
function lockScreen(){const g=$('#gate');g.className='';const n=S.user.name&&S.user.name!=='Guest'?', '+esc(S.user.name):'';const pinUI=S.user.pin?`<div class="dots" id="dots"></div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button data-a="key" data-p="${k}">${k}</button>`).join('')}<span></span><button data-a="key" data-p="0">0</button><button data-a="key" data-p="b" aria-label="Delete">⌫</button></div>`:'';g.innerHTML=`<div class="gw"><svg class="lg sm" viewBox="0 0 100 100">${LOGO}</svg><h2 style="margin:0">Welcome back${n}</h2>${pinUI}${S.user.biometricId?`<button class="btn g" data-a="bioUnlock">Unlock with ${esc(S.user.biometricLabel||bioLabel())}</button>`:''}${S.user.pin?'<button class="lk" data-a="forgot">Forgot PIN?</button>':''}</div>`;dots()}
function enter(){document.body.classList.add('in');const g=$('#gate');g.classList.add('out');setTimeout(()=>{g.innerHTML='';g.className=''},450);draw();if(!S.tutorialDone)setTimeout(()=>showTour(),520);else setTimeout(()=>runReminders(),800);setTimeout(scheduleSync,1500)}
apply();
setTimeout(()=>{const s=$('#splash');s.classList.add('out');setTimeout(()=>s.remove(),550);if(!S.user)welcome();else if(S.user.biometricId&&/iPhone|iPad|iPod/i.test(navigator.userAgent)){lockScreen();setTimeout(()=>A.bioUnlock(),250)}else if(S.user.pin||S.user.biometricId)lockScreen();else enter()},2100);
</script></body></html>
